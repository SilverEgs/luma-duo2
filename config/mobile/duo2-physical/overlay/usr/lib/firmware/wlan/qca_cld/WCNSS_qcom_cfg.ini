# Luma Duo 2: qcacld-3.0 (wlan.ko) settings for the QCA6490 (docs/wifi-bt.md).
# Anything not set here takes the driver's built-in default.

# The unit's own MAC address, from wlan_mac.bin next to this file, which
# luma-duo2-radio-setup writes from the persist partition at each boot.
read_mac_addr_from_mac_file=1

# No IPA data-path offload: nothing on Luma sets up the IPA WDI pipes.
gIPAConfig=0

# Radio capabilities, as Microsoft's own configuration sets them.
gDot11Mode=0
gEnable2x2=1
gChannelBondingMode5GHz=1
gEnableVhtFor24GHzBand=1
gVhtRxMCS=2
gVhtTxMCS=2
gVhtRxMCS2x2=2
gVhtTxMCS2x2=2
gEnableTXSTBC=1
gEnableMuBformee=1
g11dSupportEnabled=1
gEnableDFSChnlScan=1
gAllowDFSChannelRoam=1
gRrmEnable=1
BandCapability=3
oem_6g_support_disable=1
scan_mode_6ghz=0

# Roaming.
FastRoamEnabled=1
RoamRssiDiff=5
gNeighborLookupThreshold=76

# Checksum, segmentation and receive offloads.
gEnableIpTcpUdpChecksumOffload=1
TSOEnable=1
GROEnable=1

gEnablefwprint=0
gEnablePacketLog=0
END
