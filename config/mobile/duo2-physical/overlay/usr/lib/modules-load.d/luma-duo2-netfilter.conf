# Luma Duo 2: nf_tables and the nftables expressions firewalld and iptables-nft
# use (docs/firewall.md; built by scripts/duo2-build-netfilter-modules.sh).
# All are loaded up front: this kernel cannot load modules on demand
# (CONFIG_STATIC_USERMODEHELPER points request_module() at Android's
# /system/bin/core_collector), so a rule whose expression module is missing
# fails with ENOENT instead.
nf_tables
nf_tables_set
nft_compat
nft_ct
nft_counter
nft_limit
nft_quota
nft_objref
nft_hash
nft_numgen
nft_connlimit
nft_socket
nf_log_common
nf_log_ipv4
nf_log_ipv6
nft_log
nft_nat
nft_chain_nat
nft_masq
nft_redir
nft_reject
nft_reject_inet
nft_reject_ipv4
nft_reject_ipv6
nft_fib
nft_fib_inet
nft_fib_ipv4
nft_fib_ipv6
