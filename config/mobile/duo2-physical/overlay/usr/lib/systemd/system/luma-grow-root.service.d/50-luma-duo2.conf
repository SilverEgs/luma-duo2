# Luma Duo 2: duo2-mkuserdata.sh sizes the root file system to fill its
# partition already, and systemd-growfs still asks the read-only /sysroot to
# resize to its own size and fails at every boot. Grow only when there is
# room to grow into.
[Service]
ExecCondition=/bin/sh -c 'dev=$(findmnt -no SOURCE /sysroot) && fs=$(dumpe2fs -h "$dev" 2>/dev/null | awk "/^Block count:/ { c = \\$3 } /^Block size:/ { s = \\$3 } END { printf \\"%%.0f\\", c * s }") && [ "$fs" -lt "$(blockdev --getsize64 "$dev")" ]'
