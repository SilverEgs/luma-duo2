# Luma Duo 2 (docs/modem.md): Microsoft's kernel shares the modem's EFS
# buffer through the msm_sharedmem UIO device, not qcom_rmtfs_mem, and has
# no remoteproc for -s to synchronise with.
#
# -r: the modem reads its EFS (calibration, IMEI) from modemst1/modemst2/
# fsg/fsc, but what it writes stays in rmtfs's memory and never reaches the
# partitions. Drop -r only with a verified backup of all four.
[Unit]
ConditionPathExists=
Requires=dev-qcom_rmtfs_uio1.device
After=dev-qcom_rmtfs_uio1.device
Before=luma-duo2-modem.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P
