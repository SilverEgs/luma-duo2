# Luma Duo 2: Microsoft's 5.4 kernel cannot set up ProtectHome=tmpfs next to
# a read-only /usr (systemd: "Failed to set up mount namespacing: /./var/home:
# Invalid argument"), and firewalld never started. Hiding the homes outright
# is at least as strict, and firewalld has no use for them.
[Service]
ProtectHome=yes
